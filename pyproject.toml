[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lazy-prices-pilot"
version = "0.1.0"
description = "Lazy Prices pilot: 10-K year-over-year similarity vs. next-year returns for five firms"
requires-python = ">=3.11"
dependencies = [
    "sec-edgar-downloader>=5.0",
    "pandas>=2.0",
    "pyarrow>=14",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "matplotlib>=3.8",
    "yfinance>=0.2.40",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pilot = "pilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
